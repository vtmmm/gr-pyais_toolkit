id: pyais_toolkit_message_type_14
label: Message Type 14 (Safety related broadcast message)
category: '[pyais_toolkit]/Message Generators'

templates:
  imports: from gnuradio import pyais_toolkit
  make: pyais_toolkit.message_type_14(${mmsi}, ${text}, ${repeat}, ${spare_1})

#  Make one 'parameters' list entry for every parameter you want settable from the GUI.
#     Keys include:
#     * id (makes the value accessible as keyname, e.g. in the make entry)
#     * label (label shown in the GUI)
#     * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#     * default
parameters:
- id: mmsi
  label: MMSI
  dtype: string
  default: '338123456'
- id: text
  label: Text
  dtype: string
  default: 'hello'
- id: repeat
  label: Repeat
  dtype: int
  default: 0
- id: spare_1
  label: spare_1
  dtype: byte
  default: b''

#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)
inputs:
- label: latlon
  domain: message
  dtype: message
  optional: True
- label: set_params
  domain: message
  dtype: message
  optional: True

outputs:
- label: nmea_list
  domain: message
  dtype: message
  optional: True

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
